  <g transform="translate(650 1120)"><rect width="150" height="30" fill="#11110F"/><rect x="180" width="150" height="30" fill="#E9DFC9" stroke="#11110F"/><rect x="360" width="150" height="30" fill="#C92F20"/><rect x="540" width="150" height="30" fill="#1D3342"/><rect x="720" width="150" height="30" fill="#A9853E"/></g>
