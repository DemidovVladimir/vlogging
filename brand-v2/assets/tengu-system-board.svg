    </g>
  </g>
  <g transform="translate(650 820)">
    <text x="0" y="0" fill="#11110F" font-family="Menlo,monospace" font-size="18" letter-spacing="4">03 / MOTION: QUESTION → RESULT</text>
    <g transform="translate(0 54)" font-family="Menlo,monospace" font-size="14" text-anchor="middle">
