      <g transform="translate(270 0)"><rect width="240" height="210" fill="#11110F"/><rect x="105" y="74" width="30" height="30" fill="#C92F20"/><g fill="#E9DFC9"><circle cx="120" cy="38" r="8"/><circle cx="68" cy="68" r="8"/><circle cx="68" cy="126" r="8"/><circle cx="120" cy="156" r="8"/><circle cx="172" cy="126" r="8"/><circle cx="172" cy="68" r="8"/></g><text x="120" y="190" fill="#E9DFC9">02 / АГЕНТЫ</text></g>
      <g transform="translate(540 0)"><rect width="240" height="210" fill="#11110F"/><circle cx="120" cy="98" r="62" fill="none" stroke="#E9DFC9" stroke-width="8" stroke-dasharray="220 28 80 62"/><rect x="105" y="83" width="30" height="30" fill="#C92F20"/><text x="120" y="190" fill="#E9DFC9">03 / ПРОВЕРКА</text></g>
      <g transform="translate(810 0)"><rect width="240" height="210" fill="#11110F"/><circle cx="120" cy="98" r="62" fill="none" stroke="#E9DFC9" stroke-width="8" stroke-dasharray="220 28 80 62"/><path d="M120 98L170 68" stroke="#A9853E" stroke-width="7"/><circle cx="170" cy="68" r="10" fill="#A9853E"/><rect x="105" y="83" width="30" height="30" fill="#C92F20"/><text x="120" y="190" fill="#E9DFC9">04 / РЕЗУЛЬТАТ</text></g>
