      <g transform="translate(360 0)"><rect width="330" height="170" fill="#11110F"/><g transform="translate(224 -8)"><circle cx="44" cy="46" r="11" fill="#E9DFC9"/><circle cx="76" cy="68" r="11" fill="#E9DFC9"/><circle cx="30" cy="80" r="11" fill="#E9DFC9"/><path d="M44 46L76 68L30 80Z" fill="none" stroke="#C92F20" stroke-width="4"/></g><text x="26" y="76" fill="#E9DFC9" font-size="19" font-weight="700">02 / АГЕНТЫ</text><text x="26" y="132" fill="#A9853E" font-size="13">КТО ДЕЛАЕТ РАБОТУ</text></g>
