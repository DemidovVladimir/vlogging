<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">TENGU identity system</title>
  <desc id="desc">A field-manual board showing the TENGU symbol, categories, typography, colors, thumbnails, and motion.</desc>
  <rect width="1800" height="1200" fill="#E9DFC9"/>
  <path d="M50 50H1750V1150H50Z" fill="none" stroke="#11110F" stroke-width="2" opacity=".28"/>
  <path d="M600 50V1150M50 760H1750" stroke="#11110F" stroke-width="2" opacity=".22"/>
  <text x="82" y="100" fill="#11110F" font-family="Menlo,monospace" font-size="18" letter-spacing="4">TENGU / FIELD IDENTITY / V2.0</text>
  <text x="82" y="164" fill="#11110F" font-family="'Avenir Next','Helvetica Neue',sans-serif" font-size="66" font-weight="800" letter-spacing="8">ИИ НА ПРАКТИКЕ</text>
  <text x="82" y="210" fill="#C92F20" font-family="Menlo,monospace" font-size="17" font-weight="700" letter-spacing="2">ЧЕЛОВЕК → АГЕНТЫ</text>
