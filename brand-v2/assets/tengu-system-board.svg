      <g transform="translate(720 0)"><rect width="330" height="170" fill="#11110F"/><circle cx="246" cy="38" r="15" fill="#E9DFC9"/><circle cx="286" cy="42" r="14" fill="#C92F20"/><path d="M224 82C226 62 266 62 268 82M266 82C268 65 304 65 306 82" fill="#E9DFC9"/><text x="26" y="76" fill="#E9DFC9" font-size="19" font-weight="700">06 / ЛЮДИ</text><text x="26" y="132" fill="#A9853E" font-size="13">СЕМЬЯ, РАБОТА, ОБЩЕНИЕ</text></g>
