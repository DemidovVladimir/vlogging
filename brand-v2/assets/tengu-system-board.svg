    <g fill="#11110F"><circle cx="256" cy="136" r="17"/><circle cx="154" cy="197" r="17"/><circle cx="154" cy="315" r="17"/><circle cx="256" cy="376" r="17"/><circle cx="358" cy="315" r="17"/></g><circle cx="358" cy="197" r="19" fill="#A9853E"/><rect x="216" y="216" width="80" height="80" fill="#C92F20"/>
