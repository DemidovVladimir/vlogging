<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc">
  <title id="title">Tengu Workshop intro bumper storyboard</title>
  <desc id="desc">Four frames show nodes converging, arms forming, the ring closing, and the wordmark appearing.</desc>
  <rect width="1800" height="760" fill="#ECE2CF"/>
  <text x="90" y="88" fill="#0E0B0A" font-family="'SF Pro Display','Manrope',sans-serif" font-size="48" font-weight="800">ИНТРО-БАМПЕР · 2.4 СЕК</text>
  <text x="90" y="132" fill="#5F5A51" font-family="'SFMono-Regular','JetBrains Mono',monospace" font-size="20" letter-spacing="1.4">звук: три сухих щелчка → короткий воздушный взмах → низкий удар печати</text>
  <g transform="translate(70 190)">
    <g>
      <rect width="380" height="390" rx="22" fill="#0E0B0A"/>
      <circle cx="190" cy="194" r="18" fill="#C8A24A"/>
      <circle cx="92" cy="106" r="12" fill="#CE3526"/>
      <circle cx="306" cy="132" r="12" fill="#CE3526"/>
      <circle cx="126" cy="304" r="12" fill="#CE3526"/>
      <path d="M102 116 L172 177 M295 142 L209 181 M136 294 L181 211" stroke="#C8A24A" stroke-width="3" stroke-dasharray="7 9" opacity=".55"/>
      <text x="24" y="356" fill="#F2EADA" font-family="monospace" font-size="18">0.0–0.5 s · вызов узлов</text>
    </g>
    <g transform="translate(420)">
      <rect width="380" height="390" rx="22" fill="#0E0B0A"/>
      <g transform="translate(48 49) scale(.55)">
        <path d="M274 207 C314 166 377 170 414 214" fill="none" stroke="#CE3526" stroke-width="48" stroke-linecap="round"/>
        <path d="M274 207 C314 166 377 170 414 214" fill="none" stroke="#CE3526" stroke-width="48" stroke-linecap="round" transform="rotate(120 256 256)"/>
        <path d="M274 207 C314 166 377 170 414 214" fill="none" stroke="#CE3526" stroke-width="48" stroke-linecap="round" transform="rotate(240 256 256)"/>
        <circle cx="256" cy="256" r="42" fill="#C8A24A"/>
      </g>
      <text x="24" y="356" fill="#F2EADA" font-family="monospace" font-size="18">0.5–1.1 s · сборка роя</text>
    </g>
    <g transform="translate(840)">
      <rect width="380" height="390" rx="22" fill="#0E0B0A"/>
      <g transform="translate(48 49) scale(.55)">
        <circle cx="256" cy="256" r="218" fill="none" stroke="#C8A24A" stroke-width="18" stroke-dasharray="1190 180" transform="rotate(-20 256 256)"/>
        <path d="M274 207 C314 166 377 170 414 214" fill="none" stroke="#CE3526" stroke-width="48" stroke-linecap="round"/>
        <path d="M274 207 C314 166 377 170 414 214" fill="none" stroke="#CE3526" stroke-width="48" stroke-linecap="round" transform="rotate(120 256 256)"/>
        <path d="M274 207 C314 166 377 170 414 214" fill="none" stroke="#CE3526" stroke-width="48" stroke-linecap="round" transform="rotate(240 256 256)"/>
        <circle cx="256" cy="256" r="42" fill="#C8A24A"/>
        <circle cx="420" cy="220" r="21" fill="#C8A24A"/>
        <circle cx="420" cy="220" r="21" fill="#C8A24A" transform="rotate(120 256 256)"/>
        <circle cx="420" cy="220" r="21" fill="#C8A24A" transform="rotate(240 256 256)"/>
      </g>
      <text x="24" y="356" fill="#F2EADA" font-family="monospace" font-size="18">1.1–1.7 s · замыкается контур</text>
    </g>
    <g transform="translate(1260)">
      <rect width="380" height="390" rx="22" fill="#0E0B0A"/>
      <g transform="translate(26 88) scale(.36)">
        <circle cx="256" cy="256" r="218" fill="none" stroke="#C8A24A" stroke-width="18"/>
        <path d="M274 207 C314 166 377 170 414 214" fill="none" stroke="#CE3526" stroke-width="48" stroke-linecap="round"/>
        <path d="M274 207 C314 166 377 170 414 214" fill="none" stroke="#CE3526" stroke-width="48" stroke-linecap="round" transform="rotate(120 256 256)"/>
        <path d="M274 207 C314 166 377 170 414 214" fill="none" stroke="#CE3526" stroke-width="48" stroke-linecap="round" transform="rotate(240 256 256)"/>
        <circle cx="256" cy="256" r="42" fill="#C8A24A"/>
        <circle cx="420" cy="220" r="21" fill="#C8A24A"/>
        <circle cx="420" cy="220" r="21" fill="#C8A24A" transform="rotate(120 256 256)"/>
        <circle cx="420" cy="220" r="21" fill="#C8A24A" transform="rotate(240 256 256)"/>
      </g>
      <text x="210" y="174" fill="#F2EADA" font-family="monospace" font-size="28" font-weight="700" letter-spacing="4">TENGU</text>
      <text x="210" y="214" fill="#C8A24A" font-family="monospace" font-size="16" letter-spacing="4">WORKSHOP</text>
      <text x="24" y="356" fill="#F2EADA" font-family="monospace" font-size="18">1.7–2.4 s · удар печати</text>
    </g>
  </g>
  <text x="90" y="664" fill="#0E0B0A" font-family="'SF Pro Text','Manrope',sans-serif" font-size="25" font-weight="700">Анимация:</text>
  <text x="244" y="664" fill="#5F5A51" font-family="'SF Pro Text','Manrope',sans-serif" font-size="25">ease-out без пружины; лёгкое зерно лака; финальный кадр держать 0.45 сек.</text>
  <text x="90" y="704" fill="#0E0B0A" font-family="'SF Pro Text','Manrope',sans-serif" font-size="25" font-weight="700">Не делать:</text>
  <text x="244" y="704" fill="#5F5A51" font-family="'SF Pro Text','Manrope',sans-serif" font-size="25">гличи, неон, цифровой шум, длинный «киношный» логотип-ревил.</text>
</svg>
