<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Tengu Workshop YouTube thumbnail template</title>
  <desc id="desc">A high-contrast thumbnail template with a large headline area and a single subject zone.</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#27364F" stroke-width="1" opacity=".28"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="#0E0B0A"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <path d="M820 0 H1280 V720 H695 C810 568 842 365 820 0Z" fill="#ECE2CF"/>
  <path d="M852 0 C885 264 835 541 712 720" fill="none" stroke="#C8A24A" stroke-width="8"/>
  <rect x="64" y="58" width="274" height="50" rx="25" fill="#CE3526"/>
  <text x="92" y="92" fill="#F2EADA" font-family="'SFMono-Semibold','JetBrains Mono',monospace" font-size="23" font-weight="700" letter-spacing="2.5">БЕЗОПАСНОСТЬ</text>
  <text x="64" y="226" fill="#F2EADA" font-family="'SF Pro Display','Manrope',sans-serif" font-size="94" font-weight="800">ЗАГОЛОВОК</text>
  <text x="64" y="326" fill="#F2EADA" font-family="'SF Pro Display','Manrope',sans-serif" font-size="94" font-weight="800">В 3–5 СЛОВ</text>
  <line x1="66" y1="382" x2="610" y2="382" stroke="#CE3526" stroke-width="10"/>
  <text x="66" y="444" fill="#C8A24A" font-family="'SFMono-Regular','JetBrains Mono',monospace" font-size="26" font-weight="600" letter-spacing="1.8">ОДИН КОНКРЕТНЫЙ РЕЗУЛЬТАТ</text>
  <g transform="translate(64 564) scale(.19)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="256" cy="256" r="218" stroke="#C8A24A" stroke-width="18"/>
      <path d="M274 207 C314 166 377 170 414 214" stroke="#CE3526" stroke-width="48"/>
      <path d="M274 207 C314 166 377 170 414 214" stroke="#CE3526" stroke-width="48" transform="rotate(120 256 256)"/>
      <path d="M274 207 C314 166 377 170 414 214" stroke="#CE3526" stroke-width="48" transform="rotate(240 256 256)"/>
    </g>
    <g fill="#C8A24A">
      <circle cx="256" cy="256" r="42"/>
      <circle cx="420" cy="220" r="21"/>
      <circle cx="420" cy="220" r="21" transform="rotate(120 256 256)"/>
      <circle cx="420" cy="220" r="21" transform="rotate(240 256 256)"/>
    </g>
  </g>
  <text x="182" y="638" fill="#9E978C" font-family="'SFMono-Regular','JetBrains Mono',monospace" font-size="25" letter-spacing="4">TENGU WORKSHOP</text>
  <circle cx="1016" cy="300" r="170" fill="none" stroke="#27364F" stroke-width="5" stroke-dasharray="14 14"/>
  <text x="1016" y="292" text-anchor="middle" fill="#27364F" font-family="'SF Pro Text','Manrope',sans-serif" font-size="28" font-weight="700">ОДНО ЛИЦО</text>
  <text x="1016" y="333" text-anchor="middle" fill="#27364F" font-family="'SF Pro Text','Manrope',sans-serif" font-size="28" font-weight="700">ИЛИ ОБЪЕКТ</text>
  <rect x="850" y="510" width="332" height="92" rx="14" fill="#CE3526"/>
  <text x="1016" y="567" text-anchor="middle" fill="#F2EADA" font-family="'SFMono-Semibold','JetBrains Mono',monospace" font-size="27" font-weight="700" letter-spacing="2">ШТАМП / ВЕРДИКТ</text>
</svg>
