[project]
name = "youtube-reader"
version = "0.1.0"
description = "A private, local reading library for YouTube transcripts."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "youtube-transcript-api>=1.2.4,<2",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
